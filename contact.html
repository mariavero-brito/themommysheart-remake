<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Contact | Mommy's Heart redesign preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Questrial&family=Mansalva&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body data-page="contact">
<main>

<section class="section">
  <div class="wrap grid g2">
    <div>
      <h1>Contact</h1>
      <address style="font-style:normal">13564 Village Park Drive, Suite 205<br>Orlando, FL 32837</address>
      <p>(786) 853-2596</p>
      <p>We reply in English and Spanish. [Hours to be confirmed]</p>
      <div class="ph wide" role="img" aria-label="Map placeholder">Map placeholder</div>
    </div>
    <form data-preview-form class="side">
      <div class="field"><label for="cn">Name</label><input id="cn"></div>
      <div class="field"><label for="ce">Email</label><input id="ce" type="email"></div>
      <div class="field"><label for="cm">Message</label><textarea id="cm" rows="5"></textarea></div>
      <button class="btn" type="submit">Send message</button>
      <p class="muted">Preview only. This form does not send anything.</p>
    </form>
  </div>
</section>

</main>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/main.js"></script>
</body>
</html>
